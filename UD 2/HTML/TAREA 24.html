<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario de incidencia</title>
</head>
    <body>
        <form action="indicencia.php" method="get">
            <fieldset>
            <legend>Datos del usuario</legend>
            <label for="usuario">Usuario</label>
            <input type="text" name="usuario"  id="usuario" placeholder="(Nombre y apellidos)">
            <br>
            <input type="radio" name="rol" id="profe" value="Profe">
            <label for="profe">Profesor</label>
            <br>
            <input type="radio" name="rol" id="alumno" value="alumno">
            <label for="alumno">Alumno</label>
            </fieldset>
       
            <fieldset>
                <legend>Dónde se produce</legend>
                <input type="radio" name="donde" id="departamento" value="Departamento">
                <label for="departamento">En todo el departamento</label>
                <br>
                <input type="radio" name="donde" id="aula" value="Aula">
                <label for="aula">En todo el aula</label>
                <br>
                <input type="radio" name="donde" id="ordenador" value="Ordenador" checked>
                <label for="departamento">Sólo en un equipo</label>
                <br>
                <label for="localizacionespecifica">Identifica el departamento, aula o equipo:</label>
                <input type="text" id="localizacionespecifica" name="LocalizacionEspecifica">
            </fieldset>
       
            <fieldset>
                <legend>Información de la incidencia</legend>
                <textarea name="comentario" rows="6" cols="71" placeholder="Describe aquí la incidencia"></textarea>
                <br>
                Nivel de urgencia
                <br>
                <input type="radio" name="urgencia" id="alto" value="Alto">
                <label for="alto">Alto</label>
                <br>
                <input type="radio" name="urgencia" id="medio" value="Medio">
                <label for="medio">Medio</label>
                <br>
                <input type="radio" name="urgencia" id="bajo" value="Bajo">
                <label for="bajo">Bajo</label>
            </fieldset>
       
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">

    </form>
    </body>
 </html>
