<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reserva de Habitación</title>
</head>

<body>
    <form action="reserva.php" method="get">
        <fieldset>
            <legend>Datos del solicitante</legend>
            <label for="nombre">Nombre del solicitante de la reserva</label>
            <br>
            <input type="text" name="nombre" id="nombre" size="70">
            <br>
            <label for="telefono">Teléfono de contacto</label>
            <input type="text" name="telefono" id="telefono" size="9" maxlength="9" placeholder="9 números">
            <br>
            <label for="dni">DNI (Seleccione un archivo de imagen)</label>
            <input type="file" accept="image/*" name="dni" id="dni">
        </fieldset>
        <fieldset>
            <legend>Datos de la reserva</legend>
            <label for="color">Habitación:</label>
            <br>
            <select name="color" id="color" size="4">
                <option value="azul" selected>Azul</option>
                <option value="verde">Verde</option>
                <option value="amarilla">Amarilla</option>
                <option value="morada">Morada</option>
            </select>
            <br>
            <label for="ocupacion">Ocupación:</label>
            <br>
            <select name="ocupacion" id="ocupacion" size="2">
                <option value="1">Individual</option>
                <option value="2" selected>Doble</option>
            </select>
            <br>
            <label for="provincia">Provincia</label>
            <br>
            <select id="provincia" name="provincia">
                <optgroup label="Galicia">
                    <option value="coruña">A Coruña</option>
                    <option value="lugo">Lugo</option>
                    <option value="ourense">Ourense</option>
                    <option value="pontevedra">Pontevedra</option>
                </optgroup>
                <optgroup label="País Vasco">
                    <option value="vizcaya">Vizcaya</option>
                    <option value="guipuzcoa">Guipúzcoa</option>
                    <option value="alava">Álava</option>
                </optgroup>
            </select>
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Restablecer">
    </form>
</body>

</html>
