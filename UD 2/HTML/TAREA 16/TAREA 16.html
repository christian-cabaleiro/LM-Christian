<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patatas fritas</title>
</head>
    <body>
        <h1>Patatas fritas</h1>
        <hr>
        <img src="16-patatas-fritas.png" width="288" height="185">
        <br> Patatas fritas caseras
        <h2>Ingredientes</h2>
        <ul>
            <li>3 o 4 patatas (300g)</li>
            <li>4 dientes de ajo</li>
            <li>Aceite de oliva</li>
            <li>Sal</li>
        </ul>
        <h2>Elaboración (pasos)</h2>
        <ol>
            <li>Calentar aceite en una sarten</li>
            <li>Añadir las patatas cortadas, la sal y los ajos</li>
            <li>Freir al gusto</li>
            <li>Servir en plato</li>

        </ol>
    </body>
 </html>
